databases:
  - name: agrivigil-ai-db
    databaseName: agrivigil
    user: agrivigil
    plan: free
    region: frankfurt

services:
  - type: web
    name: agrivigil-ai-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/experts/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://azizcompaore.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: agrivigil-ai-db
          property: connectionString
